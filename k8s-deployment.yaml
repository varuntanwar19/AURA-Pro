apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurax-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aurax-backend
  template:
    metadata:
      labels:
        app: aurax-backend
    spec:
      containers:
      - name: backend
        image: aurax-backend:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aurax-backend-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: aurax-backend