name: AURA Deploy to Azure

on:
  # Azure deployment uses production credentials and must be started manually.
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ────────────────────────────────────────────────────────
  # Job 1: Build & Push Backend
  # ────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short || echo "No tests found, skipping."

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_NAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push backend Docker image
        run: |
          IMAGE_TAG=${{ secrets.ACR_NAME }}.azurecr.io/aura-backend:${{ github.sha }}
          docker build -t $IMAGE_TAG ./backend
          docker push $IMAGE_TAG
          echo "BACKEND_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

  # ────────────────────────────────────────────────────────
  # Job 2: Build & Push Frontend
  # ────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: Build React application
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://aura-backend.azurewebsites.net' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'wss://aura-backend.azurewebsites.net' }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_NAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push frontend Docker image
        run: |
          IMAGE_TAG=${{ secrets.ACR_NAME }}.azurecr.io/aura-frontend:${{ github.sha }}
          docker build -t $IMAGE_TAG ./frontend
          docker push $IMAGE_TAG
          echo "FRONTEND_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

  # ────────────────────────────────────────────────────────
  # Job 3: Deploy to AKS
  # ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: aura-poc-rg

      - name: Substitute image tags in manifests
        run: |
          sed -i "s|BACKEND_IMAGE_PLACEHOLDER|${{ secrets.ACR_NAME }}.azurecr.io/aura-backend:${{ github.sha }}|g" k8s/backend-deployment.yml || true
          sed -i "s|FRONTEND_IMAGE_PLACEHOLDER|${{ secrets.ACR_NAME }}.azurecr.io/aura-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yml || true

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ --recursive || echo "k8s/ directory not found, skipping kubectl apply."

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/aura-backend --timeout=120s || true
          kubectl rollout status deployment/aura-frontend --timeout=120s || true

      - name: Print service endpoints
        run: |
          echo "=== Deployed Services ==="
          kubectl get services -o wide || true
          echo "========================="
